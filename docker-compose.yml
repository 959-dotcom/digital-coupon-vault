# Local Docker only. Production runs on Vercel and Supabase. See DEPLOY.md.

services:
  postgres:
    profiles: ["local"]
    image: postgres:16
    environment:
      POSTGRES_USER: coupon
      POSTGRES_PASSWORD: coupon
      POSTGRES_DB: coupon
    ports:
      - "5432:5432"
    volumes:
      - vantage_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-ltree.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupon -d coupon"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    profiles: ["local", "production"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - vantage_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: ["production"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/main.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      APP_URL: ${APP_URL:-}
      ORACLE_SOURCE_URLS: ${ORACLE_SOURCE_URLS:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      SERVER_VAULT_SECRET: ${SERVER_VAULT_SECRET:-}
      HMAC_SECRET: ${HMAC_SECRET:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s
    restart: unless-stopped

  worker:
    profiles: ["production"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/workers/batch.worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      SERVER_VAULT_SECRET: ${SERVER_VAULT_SECRET:-}
      HMAC_SECRET: ${HMAC_SECRET:-}
      ORACLE_SOURCE_URLS: ${ORACLE_SOURCE_URLS:-}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["production"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      HMAC_SECRET: ${HMAC_SECRET:-}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  vantage_pg:
  vantage_redis:
